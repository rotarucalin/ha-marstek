set_operating_mode_passive:
  name: Set passive mode
  description: Set Marstek battery system to passive mode with power and countdown.
  fields:
    entity_id:
      name: Entity ID
      description: The operating mode select entity for the Marstek device.
      required: true
      selector:
        entity:
          domain: select
          integration: marstek
    power:
      name: Power
      description: Passive mode power in watts. Positive discharges, negative charges.
      required: true
      example: 800
      selector:
        number:
          min: -3000
          max: 3000
          step: 10
          mode: box
    cd_time:
      name: Countdown
      description: Countdown in seconds.
      required: true
      example: 3600
      selector:
        number:
          min: 1
          max: 86400
          step: 1
          mode: box