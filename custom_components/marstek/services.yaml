set_operating_mode_passive:
  name: Set passive mode
  description: Set and maintain Marstek battery system passive mode power.
  fields:
    entity_id:
      name: Entity ID
      description: The operating mode select entity for the Marstek device.
      required: true
      selector:
        entity:
          domain: select
          integration: marstek
    power:
      name: Power
      description: Desired real battery output in watts. Positive discharges, negative charges. The integration automatically compensates for inverter/standby losses so this reflects actual output, not the raw device command. Values beyond your device's configured Max Passive Power are clamped.
      required: true
      example: 800
      selector:
        number:
          min: -3000
          max: 3000
          step: 10
          mode: box
    cd_time:
      name: Countdown
      description: Retained for compatibility and ignored by the integration.
      required: true
      example: 3600
      selector:
        number:
          min: 1
          max: 86400
          step: 1
          mode: box